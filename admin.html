<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>表格列查询控制生成系统 · 管理后台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f4f6fa;color:#2c3e50;min-height:100vh;padding:24px}
h1{font-size:22px;font-weight:600;margin-bottom:4px}
.sub{color:#7a8a9a;font-size:13px;margin-bottom:20px}
.card{background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:20px;margin-bottom:20px}
.card h2{font-size:16px;font-weight:600;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #eef1f6;display:flex;align-items:center;gap:8px}
.card h2 .idx{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;background:#3498db;color:#fff;border-radius:50%;font-size:13px;font-weight:600}
label{display:block;font-size:13px;color:#555;margin-bottom:4px}
input[type=text],input[type=password],textarea,select{width:100%;padding:9px 12px;border:1px solid #dce3ec;border-radius:6px;font-size:13px;font-family:inherit;outline:none;transition:border-color .15s}
input[type=text]:focus,input[type=password]:focus,textarea:focus,select:focus{border-color:#3498db;box-shadow:0 0 0 3px rgba(52,152,219,.1)}
textarea{resize:vertical;min-height:70px}
input[type=color]{width:48px;height:32px;border:1px solid #dce3ec;border-radius:6px;cursor:pointer;padding:2px}
.row{display:grid;gap:14px}
.row2{grid-template-columns:1fr 1fr}
.row3{grid-template-columns:1fr 1fr 1fr}
.upload-zone{border:2px dashed #c7d2de;border-radius:10px;padding:40px;text-align:center;cursor:pointer;transition:all .15s;background:#fafbfd}
.upload-zone:hover,.upload-zone.drag{border-color:#3498db;background:#eef7ff}
.upload-zone p{color:#7a8a9a;font-size:14px;margin-top:8px}
.upload-zone .big{font-size:40px;color:#3498db;margin-bottom:6px}
.file-info{margin-top:12px;padding:10px 14px;background:#eef7ff;border-radius:6px;font-size:13px;color:#2c3e50;display:none}
.sheet-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sheet-chip{padding:6px 14px;border-radius:20px;background:#ecf0f4;font-size:13px;cursor:pointer;border:1px solid transparent;transition:all .15s}
.sheet-chip:hover{background:#dfe6ee}
.sheet-chip.active{background:#3498db;color:#fff}
.btn{padding:9px 18px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:#3498db;color:#fff}
.btn-primary:hover{background:#2980b9}
.btn-success{background:#27ae60;color:#fff}
.btn-success:hover{background:#219a52}
.btn-ghost{background:transparent;color:#555;border:1px solid #dce3ec}
.btn-ghost:hover{background:#f4f6fa}
.btn:disabled{opacity:.5;cursor:not-allowed}
.col-list{border:1px solid #eef1f6;border-radius:8px;max-height:340px;overflow-y:auto}
.col-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #f0f3f7;background:#fff;cursor:move;user-select:none}
.col-item:last-child{border-bottom:none}
.col-item:hover{background:#fafbfd}
.col-item .handle{color:#b0b8c1;font-size:14px}
.col-item input[type=checkbox]{width:16px;height:16px;cursor:pointer}
.col-item .name{flex:1;font-size:13px}
.col-item .hint{font-size:11px;color:#9aa5b1;margin-left:6px}
.col-item.dragging{opacity:.5;background:#eef7ff}
.col-item.drop-target{border-top:2px solid #3498db}
.preview-wrap{border:1px solid #eef1f6;border-radius:8px;max-height:300px;overflow:auto}
table.preview{width:100%;border-collapse:collapse;font-size:12px}
table.preview th,table.preview td{padding:6px 10px;border-bottom:1px solid #f0f3f7;text-align:left;white-space:nowrap}
table.preview th{background:#f7f9fc;position:sticky;top:0;font-weight:600;color:#555}
table.preview tr:hover td{background:#fafbfd}
.stats{color:#7a8a9a;font-size:12px;margin-top:6px}
.actions{position:sticky;bottom:0;background:#f4f6fa;padding-top:18px;display:flex;gap:10px;justify-content:flex-end}
.divider{height:1px;background:#eef1f6;margin:14px 0}
.tip{font-size:12px;color:#7a8a9a;margin-top:6px;line-height:1.6}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;background:#eef7ff;color:#3498db;font-size:11px;margin-left:6px}
.first-col-tag{background:#fff3e0;color:#e67e22}
</style>
</head>
<body>

<h1>📊 表格列查询控制生成系统</h1>
<p class="sub">上传 Excel → 配置列与外观 → 生成独立单文件查询网页（数据全部内嵌，双击即可用）</p>

<!-- 1. 上传 Excel -->
<div class="card">
<h2><span class="idx">1</span> 上传 Excel 文件</h2>
<div id="dropZone" class="upload-zone">
<div class="big">📁</div>
<p>点击选择或拖入 .xlsx / .xls 文件</p>
<input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none">
</div>
<div id="fileInfo" class="file-info"></div>
<div id="sheetArea" style="display:none;margin-top:14px">
<label>选择工作表（Sheet）</label>
<div id="sheetList" class="sheet-list"></div>
</div>
</div>

<!-- 2. 预览 -->
<div class="card" id="previewCard" style="display:none">
<h2><span class="idx">2</span> 数据预览（前 50 行）</h2>
<div class="preview-wrap">
<table class="preview" id="previewTable"></table>
</div>
<div class="stats" id="stats"></div>
<p class="tip">💡 第一列将作为筛选项在前后台受控展示。共检测到 <b id="colCount">0</b> 列。</p>
</div>

<!-- 3. 表格配置 -->
<div class="card" id="configCard" style="display:none">
<h2><span class="idx">3</span> 前台页面配置</h2>
<div class="row">
<div>
<label>页面标题</label>
<input type="text" id="cfgTitle" value="数据查询系统">
</div>
<div>
<label>搜索说明（不输入任何条件时展示的提示文字）</label>
<textarea id="cfgHint">请在上方输入至少一个搜索条件，然后点击「查询」按钮。支持在任何搜索框输入关键词进行筛选。</textarea>
</div>
<div>
<label>页脚文字（可选）</label>
<input type="text" id="cfgFooter" value="">
</div>
</div>
<div class="divider"></div>
<div class="row row3">
<div>
<label>访问密码（留空则无需密码）</label>
<input type="password" id="cfgPassword" placeholder="例如：admin123">
<p class="tip">设置后，访问前台页会先要求输入密码。</p>
</div>
<div>
<label>主题主色</label>
<div style="display:flex;align-items:center;gap:10px">
<input type="color" id="cfgColor" value="#3498db">
<span id="colorHex" style="font-family:monospace;font-size:13px">#3498db</span>
</div>
</div>
<div>
<label>预设主题</label>
<select id="cfgPreset">
<option value="">自定义</option>
<option value="#3498db">🔵 天空蓝</option>
<option value="#27ae60">🟢 草地绿</option>
<option value="#e74c3c">🔴 热情红</option>
<option value="#8e44ad">🟣 典雅紫</option>
<option value="#f39c12">🟡 活力橙</option>
<option value="#1abc9c">🩵 薄荷青</option>
<option value="#2c3e50">⚫ 深夜黑</option>
</select>
</div>
</div>
</div>

<!-- 4. 搜索列配置 -->
<div class="card" id="searchCard" style="display:none">
<h2><span class="idx">4</span> 搜索列配置</h2>
<p class="tip">勾选哪些列开放给前台作为搜索输入框；可拖动排序决定在页面上的显示顺序。</p>
<div class="col-list" id="searchList"></div>
</div>

<!-- 5. 结果列配置 -->
<div class="card" id="resultCard" style="display:none">
<h2><span class="idx">5</span> 结果列配置</h2>
<p class="tip">勾选哪些列出现在查询结果表格和导出文件中；可拖动排序决定列顺序。</p>
<div class="col-list" id="resultList"></div>
</div>

<div class="actions">
<button class="btn btn-ghost" id="btnReset">重置</button>
<button class="btn btn-primary" id="btnPreviewGen" disabled>🔍 预览生成</button>
<button class="btn btn-success" id="btnGenerate" disabled>🚀 生成并下载 HTML</button>
</div>

<div id="genArea" class="card" style="display:none;margin-top:24px">
<h2><span class="idx">6</span> 生成结果</h2>
<div id="genInfo" class="stats"></div>
<textarea id="genOutput" style="width:100%;height:260px;font-family:monospace;font-size:12px" readonly></textarea>
<div style="display:flex;gap:10px;margin-top:10px">
<button class="btn btn-ghost" id="btnCopy">📋 复制 HTML</button>
<button class="btn btn-success" id="btnDownload">💾 下载为 .html</button>
</div>
</div>

<!-- ============================================================

<template id="queryTemplate">
<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f4f6fa;color:#2c3e50;min-height:100vh;padding:0}
:root{--main:__COLOR__;--main-light:__LIGHT__;--hover:__HOVER__}

<!-- 内嵌 SheetJS -->
<script>__SHEETJS__</script>

<script>
var __CFG__ = __CFGJSON__;
var __DATA__ = __DATAJSON__;

(function(){
  var correct = __CFG__.password;
  if (!correct) return;
  var lock = document.getElementById('lockScreen');
  if (!lock) return;
  var input = document.getElementById('pwdInput');
  var btn = document.getElementById('pwdBtn');
  var err = document.getElementById('pwdErr');
  function check(){
    if (input.value === correct){ lock.style.display = 'none'; }
    else { err.textContent = '密码错误，请重试'; input.select(); }
  }
  btn.addEventListener('click', check);
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter') check(); });
})();

function collectConditions(){
  var qs = [];
  document.querySelectorAll('.fields input[data-col]').forEach(function(inp){
    var v = inp.value.trim();
    if (v) qs.push({ col: inp.dataset.col, val: v.toLowerCase() });
  });
  return qs;
}

function doSearch(){
  var qs = collectConditions();
  if (qs.length === 0){
    document.getElementById('resultCount').textContent = '';
    document.getElementById('btnExport').disabled = true;
    document.getElementById('resultBox').innerHTML =
      '<div class="empty"><div class="big">🔎</div><div class="hint">' + (__CFG__.hint || '请输入至少一个搜索条件后再查询。') + '</div></div>';
    return;
  }
  var result = __DATA__.filter(function(row){
    return qs.every(function(q){
      var cell = row[q.col];
      if (cell === undefined || cell === null) return false;
      return String(cell).toLowerCase().indexOf(q.val) !== -1;
    });
  });
  renderResult(result);
}

function renderResult(rows){
  var box = document.getElementById('resultBox');
  var cols = __CFG__.resultCols;
  document.getElementById('resultCount').textContent = '共 ' + rows.length.toLocaleString() + ' 条';
  if (rows.length === 0){
    document.getElementById('btnExport').disabled = true;
    box.innerHTML = '<div class="empty"><div class="big">😶</div><div class="hint">没有找到匹配的数据，请调整搜索条件后重试。</div></div>';
    return;
  }
  var html = '<div class="table-wrap"><table><thead><tr>';
  cols.forEach(function(c){ html += '<th>' + c.name + '</th>'; });
  html += '</tr></thead><tbody>';
  rows.forEach(function(r){
    html += '<tr>';
    cols.forEach(function(c){
      var v = r[c.name];
      html += '<td>' + (v === undefined || v === null ? '' : String(v)) + '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  box.innerHTML = html;
  document.getElementById('btnExport').disabled = false;
  document.getElementById('btnExport').dataset.rows = JSON.stringify(rows);
}

document.getElementById('btnSearch').addEventListener('click', doSearch);
document.getElementById('btnReset').addEventListener('click', function(){
  document.querySelectorAll('.fields input[data-col]').forEach(function(inp){ inp.value = ''; });
  document.getElementById('resultCount').textContent = '';
  document.getElementById('btnExport').disabled = true;
  document.getElementById('resultBox').innerHTML =
    '<div class="empty"><div class="big">🔎</div><div class="hint">' + (__CFG__.hint || '请输入至少一个搜索条件后再查询。') + '</div></div>';
});

document.getElementById('btnExport').addEventListener('click', function(){
  var raw = this.dataset.rows;
  if (!raw) return;
  var rows = JSON.parse(raw);
  var cols = __CFG__.resultCols.map(function(c){ return c.name; });
  var exportData = rows.map(function(r){
    var o = {}; cols.forEach(function(c){ o[c] = r[c] === undefined ? '' : r[c]; }); return o;
  });
  var ws = XLSX.utils.json_to_sheet(exportData, { header: cols });
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, (__CFG__.sheetName || '查询结果').substring(0, 30));
  XLSX.writeFile(wb, (__CFG__.title || '查询结果') + '_' + new Date().toISOString().slice(0,10) + '.xlsx');
});

document.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && e.target.matches('.fields input')) doSearch();
});
</script>
</body>

<!-- 引入 SheetJS -->
<script src="xlsx.full.min.js"></script>
<script>
/* ===========================================================
   状态
=========================================================== */
var state = {
  workbook: null,
  sheetName: '',
  rows: [],
  headers: [],
};

/* ===========================================================
   DOM helpers
=========================================================== */
function $(id){ return document.getElementById(id); }
var dropZone = $('dropZone');
var fileInput = $('fileInput');
var fileInfo = $('fileInfo');
var sheetArea = $('sheetArea');
var sheetList = $('sheetList');
var previewCard = $('previewCard');
var previewTable = $('previewTable');
var statsEl = $('stats');
var colCountEl = $('colCount');
var configCard = $('configCard');
var searchCard = $('searchCard');
var resultCard = $('resultCard');
var btnGenerate = $('btnGenerate');
var btnPreviewGen = $('btnPreviewGen');
var genArea = $('genArea');
var genInfo = $('genInfo');
var genOutput = $('genOutput');
var colorHex = $('colorHex');

/* ===========================================================
   上传 / 拖拽
=========================================================== */
dropZone.addEventListener('click', function(){ fileInput.click(); });
dropZone.addEventListener('dragover', function(e){ e.preventDefault(); dropZone.classList.add('drag'); });
dropZone.addEventListener('dragleave', function(){ dropZone.classList.remove('drag'); });
dropZone.addEventListener('drop', function(e){
  e.preventDefault(); dropZone.classList.remove('drag');
  var f = e.dataTransfer.files[0]; if (f) handleFile(f);
});
fileInput.addEventListener('change', function(e){ var f = e.target.files[0]; if (f) handleFile(f); });

function handleFile(file){
  if (!/\.(xlsx|xls)$/i.test(file.name)){ alert('仅支持 .xlsx / .xls 文件'); return; }
  var reader = new FileReader();
  reader.onload = function(e){
    try {
      var wb = XLSX.read(e.target.result, { type: 'array' });
      state.workbook = wb;
      fileInfo.style.display = 'block';
      fileInfo.innerHTML = '\ud83d\udcc4 <b>' + file.name + '</b> \u00a0\u00b7\u00a0\u00a0 ' + (file.size/1024/1024).toFixed(2) + ' MB \u00a0\u00b7\u00a0\u00a0 ' + wb.SheetNames.length + ' \u4e2a\u5de5\u4f5c\u8868';
      renderSheets(wb.SheetNames);
    } catch(err){ alert('Excel 解析失败：' + err.message); }
  };
  reader.readAsArrayBuffer(file);
}

function renderSheets(names){
  sheetArea.style.display = 'block';
  sheetList.innerHTML = '';
  names.forEach(function(n, i){
    var chip = document.createElement('div');
    chip.className = 'sheet-chip' + (i === 0 ? ' active' : '');
    chip.textContent = n;
    chip.onclick = function(){
      sheetList.querySelectorAll('.sheet-chip').forEach(function(c){ c.classList.remove('active'); });
      chip.classList.add('active');
      selectSheet(n);
    };
    sheetList.appendChild(chip);
  });
  selectSheet(names[0]);
}

function selectSheet(name){
  state.sheetName = name;
  var ws = state.workbook.Sheets[name];
  var rows = XLSX.utils.sheet_to_json(ws, { defval: '', raw: false });
  state.rows = rows;
  state.headers = rows.length ? Object.keys(rows[0]) : [];

  renderPreview();
  renderColumnConfigs();
  previewCard.style.display = 'block';
  configCard.style.display = 'block';
  searchCard.style.display = 'block';
  resultCard.style.display = 'block';
  btnGenerate.disabled = false;
  btnPreviewGen.disabled = false;
  genArea.style.display = 'none';
}

function renderPreview(){
  previewTable.innerHTML = '';
  var hrow = previewTable.insertRow();
  state.headers.forEach(function(h){ var c = document.createElement('th'); c.textContent = h; hrow.appendChild(c); });
  var limit = Math.min(state.rows.length, 50);
  for (var i = 0; i < limit; i++){
    var tr = previewTable.insertRow();
    state.headers.forEach(function(h){
      var td = document.createElement('td');
      var v = state.rows[i][h];
      td.textContent = v === undefined || v === null ? '' : String(v);
      tr.appendChild(td);
    });
  }
  colCountEl.textContent = state.headers.length;
  statsEl.textContent = '\u5171 ' + state.rows.length.toLocaleString() + ' \u884c\u6570\u636e / ' + state.headers.length + ' \u5217\uff08\u9884\u89c8\u524d ' + limit + ' \u884c\uff09';
}

/* ===========================================================
   列配置（搜索列 + 结果列）
=========================================================== */
function renderColumnConfigs(){
  renderColList('searchList', true);
  renderColList('resultList', false);
}

function renderColList(containerId, isSearch){
  var box = $(containerId);
  box.innerHTML = '';
  state.headers.forEach(function(h, idx){
    var item = document.createElement('div');
    item.className = 'col-item';
    item.draggable = true;
    var isFirst = idx === 0;
    var checked = isSearch ? (isFirst ? 'checked' : '') : 'checked';
    item.innerHTML = '<span class="handle">\u22ee\u22ee</span><input type="checkbox" data-idx="' + idx + '" ' + checked + '><span class="name">' + h + (isFirst ? '<span class="tag first-col-tag">第一列</span>' : '') + '</span><span class="hint">\u5217 #' + (idx+1) + '</span>';
    box.appendChild(item);
  });
  attachDrag(box);
}

function attachDrag(box){
  var dragging = null;
  box.querySelectorAll('.col-item').forEach(function(item){
    item.addEventListener('dragstart', function(){ dragging = item; item.classList.add('dragging'); });
    item.addEventListener('dragend', function(){
      item.classList.remove('dragging');
      box.querySelectorAll('.col-item').forEach(function(i){ i.classList.remove('drop-target'); });
      dragging = null;
    });
    item.addEventListener('dragover', function(e){ e.preventDefault(); if (dragging && dragging !== item) item.classList.add('drop-target'); });
    item.addEventListener('dragleave', function(){ item.classList.remove('drop-target'); });
    item.addEventListener('drop', function(e){
      e.preventDefault();
      if (!dragging || dragging === item) return;
      if (dragging.compareDocumentPosition(item) & Node.DOCUMENT_POSITION_FOLLOWING) item.after(dragging); else item.before(dragging);
      box.querySelectorAll('.col-item').forEach(function(i){ i.classList.remove('drop-target'); });
    });
  });
}

function getOrderedChecked(containerId){
  var box = $(containerId);
  var checked = [];
  box.querySelectorAll('.col-item').forEach(function(item){
    var cb = item.querySelector('input[type=checkbox]');
    if (cb.checked){
      var idx = parseInt(cb.dataset.idx, 10);
      checked.push({ idx: idx, name: state.headers[idx] });
    }
  });
  return checked;
}

/* ===========================================================
   主题颜色同步
=========================================================== */
$('cfgColor').addEventListener('input', function(e){ colorHex.textContent = e.target.value; });
$('cfgPreset').addEventListener('change', function(e){
  if (e.target.value){ $('cfgColor').value = e.target.value; colorHex.textContent = e.target.value; }
});

/* ===========================================================
   颜色工具
=========================================================== */
function hexToRgb(hex){
  hex = hex.replace('#','');
  if (hex.length === 3) hex = hex.split('').map(function(c){ return c+c; }).join('');
  return { r: parseInt(hex.substr(0,2),16), g: parseInt(hex.substr(2,2),16), b: parseInt(hex.substr(4,2),16) };
}
function shade(hex, pct){
  var c = hexToRgb(hex);
  var t = pct < 0 ? 0 : 255;
  var p = Math.abs(pct)/100;
  var nr = Math.round((t-c.r)*p + c.r);
  var ng = Math.round((t-c.g)*p + c.g);
  var nb = Math.round((t-c.b)*p + c.b);
  return '#' + [nr,ng,nb].map(function(v){ return v.toString(16).padStart(2,'0'); }).join('');
}

/* ===========================================================
   生成 HTML
=========================================================== */
async function buildStandaloneHtml(){
  var searchCols = getOrderedChecked('searchList');
  var resultCols = getOrderedChecked('resultList');
  if (searchCols.length === 0){ alert('请至少勾选一个搜索列'); return null; }
  if (resultCols.length === 0){ alert('请至少勾选一个结果列'); return null; }

  var cfg = {
    title: $('cfgTitle').value || '数据查询系统',
    hint: $('cfgHint').value || '',
    footer: $('cfgFooter').value || '',
    password: $('cfgPassword').value || '',
    color: $('cfgColor').value || '#3498db',
    sheetName: state.sheetName,
    searchCols: searchCols,
    resultCols: resultCols,
    headers: state.headers,
  };

  // 读取本地 SheetJS 代码嵌入
  var sheetJsCode = '';
  try {
    var resp = await fetch('xlsx.full.min.js', { cache: 'no-store' });
    sheetJsCode = await resp.text();
  } catch(e){
    alert('未能读取本地 xlsx.full.min.js：' + e.message + '\n请确保 xlsx.full.min.js 与 admin.html 在同一目录。');
    return null;
  }

  return fillTemplate(cfg, sheetJsCode, state.rows);
}

function fillTemplate(cfg, sheetJsCode, rows){
  var tpl = $('queryTemplate').innerHTML;
  var color = cfg.color;
  var rgb = hexToRgb(color);
  var light = 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',0.12)';
  var hover = shade(color, -12);
  var color2 = shade(color, 10);
  var color3 = shade(color, -15);

  // 安全转义：避免数据里的结束脚本标签打断模板
  var safe = function(s){ return String(s).replace(/<\/script>/gi, '<\\/script>'); };

  // 搜索输入框 HTML
  var searchInputs = cfg.searchCols.map(function(c, i){
    return '        <div class="field">\n          <label>' + c.name + '</label>\n          <input type="text" data-col="' + c.name + '" id="q_' + i + '" placeholder="输入关键词…">\n        </div>';
  }).join('\n');

  // 密码门 HTML
  var lockHtml = '';
  if (cfg.password){
    lockHtml = '<div class="lock" id="lockScreen">\n  <div class="lock-box">\n    <h2>\ud83d\udd12 ' + cfg.title + '</h2>\n    <p>请输入访问密码</p>\n    <input type="password" id="pwdInput" placeholder="密码" autofocus>\n    <div class="err" id="pwdErr"></div>\n    <button id="pwdBtn">进入</button>\n  </div>\n</div>';
  }

  var subHtml = cfg.hint ? '  <div class="sub">' + cfg.hint + '</div>' : '';
  var footerHtml = cfg.footer ? '<div class="footer">' + cfg.footer + '</div>' : '';
  var emptyHint = cfg.hint || '请在上方输入搜索条件后点击「查询」。';

  var cfgJson = JSON.stringify(cfg).replace(/<\/script>/gi, '<\\/script>');
  var dataJson = JSON.stringify(rows).replace(/<\/script>/gi, '<\\/script>');

  return tpl
    .replace(/__TITLE__/g, safe(cfg.title))
    .replace(/__COLOR__/g, color)
    .replace(/__LIGHT__/g, light)
    .replace(/__HOVER__/g, hover)
    .replace(/__COLOR2__/g, color2)
    .replace(/__COLOR3__/g, color3)
    .replace('__LOCKHTML__', lockHtml)
    .replace('__SUBHTML__', subHtml)
    .replace('__SEARCHINPUTS__', searchInputs)
    .replace(/__EMPTYHINT__/g, safe(emptyHint))
    .replace('__FOOTERHTML__', footerHtml)
    .replace('__SHEETJS__', sheetJsCode)
    .replace('__CFGJSON__', cfgJson)
    .replace('__DATAJSON__', dataJson);
}

/* ===========================================================
   按钮事件
=========================================================== */
btnPreviewGen.addEventListener('click', async function(){
  var html = await buildStandaloneHtml();
  if (!html) return;
  genArea.style.display = 'block';
  genInfo.textContent = '\u5df2\u751f\u6210 \u00b7 \u5927\u5c0f\u7ea6 ' + (html.length / 1024).toFixed(1) + ' KB \u00b7 \u5305\u542b ' + state.rows.length.toLocaleString() + ' \u884c\u6570\u636e';
  genOutput.value = html;
});

btnGenerate.addEventListener('click', async function(){
  var html = await buildStandaloneHtml();
  if (!html) return;
  var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var base = (state.sheetName || 'query').replace(/[\\/:*?"<>|]/g, '_');
  a.href = url;
  a.download = base + '_查询页.html';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  genArea.style.display = 'block';
  genInfo.textContent = '\u2705 \u5df2\u89e6\u53d1\u4e0b\u8f7d \u00b7 \u5927\u5c0f\u7ea6 ' + (html.length / 1024).toFixed(1) + ' KB \u00b7 \u5305\u542b ' + state.rows.length.toLocaleString() + ' \u884c\u6570\u636e';
  genOutput.value = html;
});

$('btnDownload').addEventListener('click', function(){
  if (!genOutput.value) return;
  var blob = new Blob([genOutput.value], { type: 'text/html;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'query_page.html';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

$('btnCopy').addEventListener('click', async function(){
  try {
    await navigator.clipboard.writeText(genOutput.value);
    $('btnCopy').textContent = '\u2705 \u5df2\u590d\u5236';
    setTimeout(function(){ $('btnCopy').textContent = '\ud83d\udccb \u590d\u5236 HTML'; }, 1500);
  } catch(e){ alert('复制失败：' + e.message); }
});

$('btnReset').addEventListener('click', function(){
  if (!confirm('确定重置所有配置吗？')) return;
  $('cfgTitle').value = '数据查询系统';
  $('cfgHint').value = '请在上方输入至少一个搜索条件，然后点击「查询」按钮。支持在任何搜索框输入关键词进行筛选。';
  $('cfgFooter').value = '';
  $('cfgPassword').value = '';
  $('cfgColor').value = '#3498db';
  colorHex.textContent = '#3498db';
  $('cfgPreset').value = '';
  selectSheet(state.sheetName);
});

window.addEventListener('error', function(e){
  console.error('Admin script error:', e.error || e.message, e.filename, e.lineno);
});
