<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Test Inline</title></head>
<body>
<iframe id="admin" src="admin.html?v=23" style="width:100%;height:700px;border:1px solid #ccc"></iframe>
<pre id="report" style="background:#111;color:#0f0;padding:12px;white-space:pre-wrap;font-size:12px"></pre>
<script>
const rep = document.getElementById('report');
function log(m){ rep.textContent += m + '\n'; }
const admin = document.getElementById('admin');
admin.onload = async function(){
  try {
    const w = admin.contentWindow, d = admin.contentDocument;
    const resp = await fetch('bench_50k.xlsx');
    const buf = await resp.arrayBuffer();
    const file = new File([buf], 'bench_50k.xlsx', {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const dt = new DataTransfer(); dt.items.add(file);
    const fi = d.getElementById('fileInput'); fi.files = dt.files;
    fi.dispatchEvent(new Event('change'));
    await new Promise(r=>setTimeout(r,4000));
    log('stats: ' + d.getElementById('stats').textContent);
    d.getElementById('configCard').style.display='';
    d.getElementById('searchCard').style.display='';
    d.getElementById('resultCard').style.display='';
    await new Promise(r=>setTimeout(r,500));
    const firstSearch = d.querySelectorAll('#searchList .col-item')[0];
    const sCb = firstSearch.querySelector('input[type=checkbox]');
    if (sCb && !sCb.checked) sCb.click();
    d.querySelectorAll('#resultList .col-item').forEach(it=>{const cb=it.querySelector('input[type=checkbox]');if(cb&&!cb.checked)cb.click();});
    await new Promise(r=>setTimeout(r,300));
    d.getElementById('btnPreviewGen').disabled=false;
    d.getElementById('btnGenerate').disabled=false;
    const html = await w.buildStandaloneHtml();
    if (!html){ log('buildStandaloneHtml returned null'); return; }
    log('htmlMB: ' + (html.length/1024/1024).toFixed(2));
    log('hasSheetJsInline: ' + html.includes('xlsx.full.min.js'));
    const blob = new Blob([html],{type:'text/html'});
    const url = URL.createObjectURL(blob);
    const q = document.createElement('iframe');
    q.src = url;
    q.style.cssText='width:100%;height:700px;border:1px solid #ccc';
    document.body.appendChild(q);
    await new Promise(r=>setTimeout(r,2000));
    const qd = q.contentDocument;
    const exactInput = qd.querySelector('.fields input[data-i="0"]');
    exactInput.value = 'sample';
    q.contentWindow.document.getElementById('btnSearch').click();
    await new Promise(r=>setTimeout(r,300));
    log('resultCount: ' + qd.getElementById('resultCount').textContent);
    log('emptyHint: ' + (qd.querySelector('.empty .hint') ? qd.querySelector('.empty .hint').textContent.slice(0,60) : 'none'));
    log('\nDONE');
  } catch(e){ log('ERROR: '+e.message+'\n'+e.stack); }
};
</script>
</body></html>
